<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Падающий снег</title>
  <style>
    body {
      background: #666;
      position: relative;
      min-height: 100vh;
      margin: 0;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    body:after,
    body:before{
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 33.33vw;
    }
    body:before{
      left: 0;
      background: #000;
    }
    body:after{
      right: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <p>test text to select</p>

  <script src="snow.js" defer></script>
</body>
</html>
